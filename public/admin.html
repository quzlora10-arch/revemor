<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rêvemor Admin Paneli</title><link rel="stylesheet" href="/admin.css"></head>
<body>
<header><a href="/" class="brand">Rêvemor</a><div>Yönetim Paneli <button id="accountSettings">Hesap Ayarları</button> <button id="logout">Çıkış</button></div></header>
<div class="shell"><aside>
<button class="nav active" data-tab="dashboard">Dashboard</button>
<button class="nav" data-tab="users">Kullanıcılar</button>
<button class="nav" data-tab="channels">Kanallar</button>
<button class="nav" data-tab="videos">Videolar</button>
</aside><main>
<div id="loginBox" class="loginbox">
<h1>Admin Girişi</h1><p>Admin hesabınızla giriş yapın.</p>
<form id="adminLogin" class="form">
<input id="adminLoginName" placeholder="Admin nickname veya e-posta" required>
<input id="adminLoginPassword" type="password" placeholder="Şifre" required>
<button class="primary">Giriş yap</button><div id="adminLoginMsg"></div>
</form></div>
<div id="panel" class="hidden">
<div id="settingsBox" class="settings hidden">
<h2>Admin Hesap Ayarları</h2>
<p class="muted">Admin nickname ve şifreni buradan değiştirebilirsin.</p>
<form id="settingsForm" class="form">
<input id="settingsNick" placeholder="Yeni nickname">
<input id="settingsOldPassword" type="password" placeholder="Mevcut şifre">
<input id="settingsNewPassword" type="password" placeholder="Yeni şifre (en az 8 karakter)">
<button class="primary">Değişiklikleri kaydet</button>
<div id="settingsMsg"></div>
</form>
</div>
<section id="dashboard" class="tabpage"><h1>Genel Bakış</h1><div id="stats" class="stats"></div></section>
<section id="users" class="tabpage hidden"><h1>Kullanıcılar</h1><div id="usersTable"></div></section>
<section id="channels" class="tabpage hidden"><h1>Kanallar</h1><div id="channelsTable"></div></section>
<section id="videos" class="tabpage hidden"><h1>Videolar</h1><div id="videosTable"></div></section>
</div></main></div><script src="/admin.js"></script></body></html>
