<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rêvemor — Video Platformu</title>
<meta name="description" content="Rêvemor — videolarını keşfet, kanalları takip et ve kendi kanalını oluştur.">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/assets/revemor-logo.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="menuBtn">☰</button>
  <a class="brand" href="/"><img src="/assets/revemor-logo.png" alt="Rêvemor"><span>Rêvemor</span></a>
  <form id="searchForm" class="search"><input id="searchInput" placeholder="Ara"><button>⌕</button></form>
  <div class="top-actions"><button class="ghost" id="loginBtn">Oturum aç</button><button class="avatar" id="meBtn">◉</button></div>
</header>
<div class="layout">
<aside id="sidebar">
  <a class="sideitem active" href="/">⌂ <span>Ana Sayfa</span></a>
  <a class="sideitem" href="#shorts">▶ <span>Shorts</span></a>
  <a class="sideitem" href="#channels">▣ <span>Kanallar</span></a>
  <a class="sideitem" href="#account">◉ <span>Hesabım</span></a>
  <div class="side-title">Rêvemor</div>
  <a class="sideitem" href="/admin">⚙ <span>Yönetim</span></a>
</aside>
<main class="content">
  <div class="chips"><button class="chip selected">Tümü</button><button class="chip">Oyun</button><button class="chip">Müzik</button><button class="chip">Canlı</button><button class="chip">Haberler</button><button class="chip">Podcast</button><button class="chip">Eğitim</button></div>
  <section class="hero">
    <div><p class="eyebrow">RÊVEMOR</p><h1>Videoların yeni adresi.</h1><p>Kendi kanalını oluştur, videonu yükle ve topluluğunu büyüt.</p><button class="primary" id="heroRegister">Hesap oluştur</button></div>
    <img src="/assets/revemor-logo.png" alt="" class="hero-logo">
  </section>
  <div class="section-head"><h2>Senin için</h2><button class="linkbtn" id="refresh">Yenile</button></div>
  <div id="videoGrid" class="grid"></div>
  <div id="empty" class="empty hidden">Henüz video yok. İlk videoyu sen yükleyebilirsin.</div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div>
<script src="/app.js"></script>
</body>
</html>
